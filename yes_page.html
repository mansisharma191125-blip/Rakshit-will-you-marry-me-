<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yayyyyyy</title>

    <link rel="stylesheet" href="./yes_style.css">
    <link rel="preload" href="yes.webp" as="image">
    <link rel="stylesheet" href="loader.css">
</head>

<body>

    <audio id="bgMusic" autoplay loop>
        <source src="./MAGIC_-_Rude_Offblogmedia.com.mp3" type="audio/mpeg">
    </audio>

    <div id="loading-overlay">
        <div class="loading-container">
            <div class="paper-heart"></div>
            <div class="paper-heart-inner"></div>
        </div>
        <div class="loading-text">YAY!!!</div>
    </div>

    <script src="loader.js"></script>

    <div class="container">
        <h1 class="header_text">Aww you making me blush &gt;.&lt;</h1>

        <h1 class="header_text">Hehe knew you would say yes! ;)</h1>

        <div class="gif_container">
            <img src="yes.webp" alt="Celebrating GIF" fetchpriority="high">
        </div>

        <h1 class="header_text">I love you too my sweet heart</h1>
    </div>

    <script>
        const music = document.getElementById("bgMusic");

        music.volume = 1.0;

        // Try immediately
        music.play().catch(() => {
            console.log("Browser blocked autoplay.");
        });

        // Fallback: first click/tap starts it
        document.addEventListener("click", () => {
            music.play();
        }, { once: true });
    </script>

</body>
</html>
